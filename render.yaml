services:
  - type: web
    name: hinunangan-swine-registry
    env: node
    plan: free
    region: singapore # or oregon, frankfurt, etc.
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard -> Environment
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
